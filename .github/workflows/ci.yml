name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
